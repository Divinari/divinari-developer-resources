name: Test Public Schemas & Validator

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Schema Validation & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Safely
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: python -m pip install --no-cache-dir -r validator/requirements.txt

      - name: Run Validator CLI Across All Valid Fixtures
        run: |
          python validator/divinari_validate.py --schema schemas/language-metadata.schema.json examples/valid-language-metadata-tl.json
          python validator/divinari_validate.py --schema schemas/lexicon-entry.schema.json examples/valid-lexicon-tl.json
          python validator/divinari_validate.py --schema schemas/example-sentence.schema.json examples/valid-example-sentence-tl.json
          python validator/divinari_validate.py --schema schemas/writing-system.schema.json examples/valid-writing-system-baybayin.json
          python validator/divinari_validate.py --schema schemas/curriculum-unit.schema.json examples/valid-curriculum-unit.json
          python validator/divinari_validate.py --schema schemas/heritage-contribution.schema.json examples/valid-heritage-contribution.json
          python validator/divinari_validate.py --schema schemas/scripture-bundle.schema.json examples/valid-scripture-kjv-excerpt.json

      - name: Run Pytest Validator Test Suite
        run: pytest -q validator/tests/
